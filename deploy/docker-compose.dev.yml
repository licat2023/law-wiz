# 本地开发及演示栈。配置和空库初始化步骤见同目录 README。

name: lawwiz-dev

services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # ⚠️ 必须含 STRICT_TRANS_TABLES：非严格模式下超长值会被**静默截断**（docs/04 §2.2）
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --innodb_buffer_pool_size=128M
      # ⚠️ 时区固定 +08:00：应用存的是**北京时间**（core/clock.py），而 DDL 里
      #    `CURRENT_TIMESTAMP(3)`（默认值与 ON UPDATE）取的是**会话时区**。
      #    服务器时区不是 +08:00 时，同一个库里会混进两种时间口径。
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${LAWWIZ_MYSQL_ROOT_PASSWORD:-root-not-for-prod}
      MYSQL_DATABASE: ${LAWWIZ_DB_NAME:-law_wiz}
      MYSQL_USER: ${LAWWIZ_DB_USER:-lawwiz}
      MYSQL_PASSWORD: ${LAWWIZ_DB_PASSWORD:-changeme}
      KB_MYSQL_DATABASE: ${KB_MYSQL_DATABASE:-law_wiz_kb}
      KB_MYSQL_USER: ${KB_MYSQL_USER:-lawwiz_kb}
      KB_MYSQL_PASSWORD: ${KB_MYSQL_PASSWORD:-dev-kb-only}
    ports:
      - "127.0.0.1:${LAWWIZ_DEV_DB_PORT:-3306}:3306"
    volumes:
      - lawwiz-dev-mysql:/var/lib/mysql
      - ./mysql-init/20-knowledge-base.sh:/docker-entrypoint-initdb.d/20-knowledge-base.sh:ro
    healthcheck:
      # 用业务账号执行查询，检查数据库能否接受应用凭据。
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 384m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 本地缓存关闭定时快照，达到内存上限时从所有键中按近似 LRU 淘汰。
    command:
      ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${LAWWIZ_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - lawwiz-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m

  backend:
    build: {context: ../backend, dockerfile: Dockerfile}
    environment:
      LAWWIZ_APP_ENV: development
      LAWWIZ_ALLOW_FIXED_VERIFY_CODE: "true"
      LAWWIZ_DB_HOST: mysql
      LAWWIZ_DB_NAME: ${LAWWIZ_DB_NAME:-law_wiz}
      LAWWIZ_DB_USER: ${LAWWIZ_DB_USER:-lawwiz}
      LAWWIZ_DB_PASSWORD: ${LAWWIZ_DB_PASSWORD:-changeme}
      LAWWIZ_REDIS_URL: redis://redis:6379/0
      LAWWIZ_JWT_SECRET:
      LAWWIZ_AI_SERVICE_BASE_URL: http://ai-service:8200
      LAWWIZ_AI_SERVICE_TOKEN: ${LAWWIZ_AI_SERVICE_TOKEN:-development-ai-token}
      LAWWIZ_AI_SERVICE_TIMEOUT_SECONDS: ${LAWWIZ_AI_SERVICE_TIMEOUT_SECONDS:-65}
      LAWWIZ_STORAGE_LOCAL_ROOT: /app/.data
      LAWWIZ_KNOWLEDGE_BASE_BASE_URL: http://knowledge-base:8100
      LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY: ${LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY:-}
      LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID: ${LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID:-}
      LAWWIZ_KNOWLEDGE_BASE_WRITER_KEY: ${LAWWIZ_KNOWLEDGE_BASE_WRITER_KEY:-}
      LAWWIZ_KNOWLEDGE_BASE_ADMIN_USER_IDS: ${LAWWIZ_KNOWLEDGE_BASE_ADMIN_USER_IDS:-[]}
    ports: ["127.0.0.1:${LAWWIZ_BACKEND_PORT:-8000}:8000"]
    volumes: [lawwiz-dev-data:/app/.data]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      knowledge-base: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
    mem_limit: 384m

  ai-service:
    build: {context: ../ai-service, dockerfile: Dockerfile}
    environment:
      AI_ENVIRONMENT: development
      AI_SERVICE_TOKEN: ${LAWWIZ_AI_SERVICE_TOKEN:-development-ai-token}
      AI_ALLOW_FAKE_MODEL: ${LAWWIZ_ALLOW_FAKE_MODEL:-true}
      AI_MODEL_API_KEY: ${LAWWIZ_MODEL_API_KEY:-}
      AI_MODEL_BASE_URL: ${LAWWIZ_MODEL_BASE_URL:-}
      AI_MODEL_NAME: ${LAWWIZ_MODEL_NAME:-}
      AI_MODEL_TIMEOUT_SECONDS: ${LAWWIZ_MODEL_TIMEOUT_SECONDS:-60}
      AI_KNOWLEDGE_BASE_BASE_URL: http://knowledge-base:8100
      AI_KNOWLEDGE_BASE_SERVICE_KEY: ${LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY:-}
      AI_KNOWLEDGE_BASE_DEFAULT_ID: ${LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/internal/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    mem_limit: 256m

  knowledge-base:
    build: {context: ../knowledge_base/backend, dockerfile: Dockerfile}
    environment:
      KB_ENVIRONMENT: development
      KB_DATABASE_URL: "${KB_DATABASE_URL:-mysql+aiomysql://${KB_MYSQL_USER:-lawwiz_kb}:${KB_MYSQL_PASSWORD:-dev-kb-only}@mysql:3306/${KB_MYSQL_DATABASE:-law_wiz_kb}?charset=utf8mb4}"
      KB_DATA_ROOT: /app/.data
      KB_ADMIN_USERNAME: ${KB_ADMIN_USERNAME:-admin}
      KB_ADMIN_PASSWORD_HASH: ${KB_ADMIN_PASSWORD_HASH:-}
      KB_JWT_SECRET: ${KB_JWT_SECRET:-}
      KB_SERVICE_KEYS_JSON:
      KB_EMBEDDING_MODE: ${KB_EMBEDDING_MODE:-development}
      KB_EMBEDDING_BASE_URL: ${KB_EMBEDDING_BASE_URL:-}
      KB_EMBEDDING_API_KEY: ${KB_EMBEDDING_API_KEY:-}
      KB_EMBEDDING_MODEL: ${KB_EMBEDDING_MODEL:-}
      KB_EMBEDDING_DIMENSIONS: ${KB_EMBEDDING_DIMENSIONS:-1536}
      KB_REQUEST_TIMEOUT_SECONDS: ${KB_REQUEST_TIMEOUT_SECONDS:-60}
      KB_RETRIEVAL_STRATEGY: ${KB_RETRIEVAL_STRATEGY:-hybrid}
      KB_RETRIEVAL_CANDIDATES: ${KB_RETRIEVAL_CANDIDATES:-24}
      KB_RERANK_ENDPOINT: ${KB_RERANK_ENDPOINT:-}
      KB_RERANK_API_KEY: ${KB_RERANK_API_KEY:-}
      KB_RERANK_TIMEOUT_SECONDS: ${KB_RERANK_TIMEOUT_SECONDS:-2}
      KB_RERANK_CANDIDATES: ${KB_RERANK_CANDIDATES:-16}
    ports: ["127.0.0.1:${KB_BACKEND_PORT:-8100}:8100"]
    volumes: [lawwiz-dev-kb-data:/app/.data]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
    mem_limit: 512m

  frontend:
    build: {context: ../frontend, dockerfile: Dockerfile, target: development}
    environment:
      LAWWIZ_API_TARGET: http://backend:8000
    ports: ["127.0.0.1:${LAWWIZ_FRONTEND_PORT:-5173}:5173"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    develop:
      watch:
        - {action: sync, path: ../frontend/src, target: /app/src}
    mem_limit: 384m

  knowledge-base-frontend:
    build: {context: ../knowledge_base/frontend, dockerfile: Dockerfile, target: development}
    environment:
      KB_API_TARGET: http://knowledge-base:8100
    ports: ["127.0.0.1:${KB_FRONTEND_PORT:-5174}:5174"]
    depends_on:
      knowledge-base: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    develop:
      watch:
        - {action: sync, path: ../knowledge_base/frontend/src, target: /app/src}
    mem_limit: 384m

volumes:
  lawwiz-dev-mysql:
  lawwiz-dev-redis:
  lawwiz-dev-data:
  lawwiz-dev-kb-data:
