# 编排两个站点、对应后端及数据服务。公网 HTTPS 由现有 OpenResty 提供。
name: lawwiz

services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --innodb_buffer_pool_size=128M
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${LAWWIZ_MYSQL_ROOT_PASSWORD:?必须设置数据库root密码}
      MYSQL_DATABASE: ${LAWWIZ_DB_NAME:-law_wiz}
      MYSQL_USER: ${LAWWIZ_DB_USER:-lawwiz}
      MYSQL_PASSWORD: ${LAWWIZ_DB_PASSWORD:?必须设置业务数据库密码}
      KB_MYSQL_DATABASE: ${KB_MYSQL_DATABASE:-law_wiz_kb}
      KB_MYSQL_USER: ${KB_MYSQL_USER:-lawwiz_kb}
      KB_MYSQL_PASSWORD: ${KB_MYSQL_PASSWORD:?必须设置独立知识库数据库密码}
    volumes:
      - lawwiz-mysql:/var/lib/mysql
      # 官方镜像只在首次初始化空卷时执行该脚本，业务库与知识库分别授权。
      - ./mysql-init/20-knowledge-base.sh:/docker-entrypoint-initdb.d/20-knowledge-base.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 384m
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [lawwiz-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 96m
    networks: [data]

  backend:
    build: {context: ../backend, dockerfile: Dockerfile}
    image: lawwiz-backend:latest
    restart: unless-stopped
    environment:
      LAWWIZ_APP_ENV: production
      LAWWIZ_DEBUG: "false"
      LAWWIZ_ALLOW_FIXED_VERIFY_CODE: "false"
      LAWWIZ_DB_HOST: mysql
      LAWWIZ_DB_PORT: "3306"
      LAWWIZ_DB_NAME: ${LAWWIZ_DB_NAME:-law_wiz}
      LAWWIZ_DB_USER: ${LAWWIZ_DB_USER:-lawwiz}
      LAWWIZ_DB_PASSWORD: ${LAWWIZ_DB_PASSWORD:?必须设置业务数据库密码}
      LAWWIZ_REDIS_URL: redis://redis:6379/0
      LAWWIZ_JWT_SECRET: ${LAWWIZ_JWT_SECRET:?必须设置业务JWT密钥}
      LAWWIZ_AI_SERVICE_BASE_URL: http://ai-service:8200
      LAWWIZ_AI_SERVICE_TOKEN: ${LAWWIZ_AI_SERVICE_TOKEN:?必须设置独立 AI 服务令牌}
      LAWWIZ_AI_SERVICE_TIMEOUT_SECONDS: ${LAWWIZ_AI_SERVICE_TIMEOUT_SECONDS:-65}
      LAWWIZ_STORAGE_BACKEND: local
      LAWWIZ_STORAGE_LOCAL_ROOT: /app/.data
      LAWWIZ_KNOWLEDGE_BASE_BASE_URL: http://knowledge-base:8100
      LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY: ${LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY:?必须设置知识库只读凭证}
      LAWWIZ_KNOWLEDGE_BASE_WRITER_KEY: ${LAWWIZ_KNOWLEDGE_BASE_WRITER_KEY:-}
      LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID: ${LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID:?必须设置默认知识库ID}
      LAWWIZ_KNOWLEDGE_BASE_ADMIN_USER_IDS: ${LAWWIZ_KNOWLEDGE_BASE_ADMIN_USER_IDS:-[]}
    # 保留宿主回环入口，供运维检查和已有工具使用。
    ports: ["127.0.0.1:${LAWWIZ_BACKEND_PORT:-8000}:8000"]
    volumes: [lawwiz-data:/app/.data]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      knowledge-base: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    networks: [data, knowledge, business-web, inference]

  ai-service:
    build: {context: ../ai-service, dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      AI_ENVIRONMENT: production
      AI_SERVICE_TOKEN: ${LAWWIZ_AI_SERVICE_TOKEN:?必须设置独立 AI 服务令牌}
      AI_MODEL_API_KEY: ${LAWWIZ_MODEL_API_KEY:?必须配置真实模型密钥}
      AI_MODEL_BASE_URL: ${LAWWIZ_MODEL_BASE_URL:?必须配置真实模型地址}
      AI_MODEL_NAME: ${LAWWIZ_MODEL_NAME:?必须配置真实模型名称}
      AI_MODEL_TIMEOUT_SECONDS: ${LAWWIZ_MODEL_TIMEOUT_SECONDS:-60}
      AI_KNOWLEDGE_BASE_BASE_URL: http://knowledge-base:8100
      AI_KNOWLEDGE_BASE_SERVICE_KEY: ${LAWWIZ_KNOWLEDGE_BASE_SERVICE_KEY:?必须设置知识库只读凭证}
      AI_KNOWLEDGE_BASE_DEFAULT_ID: ${LAWWIZ_KNOWLEDGE_BASE_DEFAULT_ID:?必须设置默认知识库ID}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/internal/health', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 10
    mem_limit: 256m
    networks: [inference, knowledge]

  knowledge-base:
    build: {context: ../knowledge_base/backend, dockerfile: Dockerfile}
    image: lawwiz-knowledge-base:latest
    restart: unless-stopped
    environment:
      KB_ENVIRONMENT: production
      KB_DATABASE_URL: ${KB_DATABASE_URL:?必须设置独立异步知识库数据库URL}
      # 首次部署须显式初始化关系表，具体命令见部署说明。
      KB_AUTO_CREATE_SCHEMA: "false"
      KB_DATA_ROOT: /app/.data
      KB_ADMIN_USERNAME: ${KB_ADMIN_USERNAME:-admin}
      KB_ADMIN_PASSWORD_HASH: ${KB_ADMIN_PASSWORD_HASH:?必须设置管理员密码哈希}
      KB_ADMIN_APPLICATION_ID: ${KB_ADMIN_APPLICATION_ID:-law-wiz}
      KB_JWT_SECRET: ${KB_JWT_SECRET:?必须设置独立知识库JWT密钥}
      KB_SERVICE_KEYS_JSON: ${KB_SERVICE_KEYS_JSON:?必须设置知识库服务凭证授权映射}
      KB_EMBEDDING_MODE: remote
      KB_EMBEDDING_BASE_URL: ${KB_EMBEDDING_BASE_URL:?必须设置真实嵌入地址}
      KB_EMBEDDING_API_KEY: ${KB_EMBEDDING_API_KEY:?必须设置真实嵌入密钥}
      KB_EMBEDDING_MODEL: ${KB_EMBEDDING_MODEL:?必须设置真实嵌入模型}
      KB_EMBEDDING_DIMENSIONS: ${KB_EMBEDDING_DIMENSIONS:-1536}
      KB_REQUEST_TIMEOUT_SECONDS: ${KB_REQUEST_TIMEOUT_SECONDS:-60}
      KB_RETRIEVAL_STRATEGY: ${KB_RETRIEVAL_STRATEGY:-hybrid}
      KB_RETRIEVAL_CANDIDATES: ${KB_RETRIEVAL_CANDIDATES:-24}
      KB_RERANK_ENDPOINT: ${KB_RERANK_ENDPOINT:-}
      KB_RERANK_API_KEY: ${KB_RERANK_API_KEY:-}
      KB_RERANK_TIMEOUT_SECONDS: ${KB_RERANK_TIMEOUT_SECONDS:-2}
      KB_RERANK_CANDIDATES: ${KB_RERANK_CANDIDATES:-16}
      KB_WORKER_ENABLED: "true"
      KB_CORS_ORIGINS: ${KB_CORS_ORIGINS:-[]}
    ports: ["127.0.0.1:${KB_BACKEND_PORT:-8100}:8100"]
    volumes: [lawwiz-kb-data:/app/.data]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      # 就绪探测读取数据库并检查 Chroma，业务后端会等待此探测通过。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # 内嵌Chroma的候选预算；必须按真实语料和同机应用重新核算。
    mem_limit: 512m
    networks: [data, knowledge, knowledge-web]

  frontend:
    build: {context: ../frontend, dockerfile: Dockerfile, target: production}
    image: lawwiz-frontend:latest
    restart: unless-stopped
    ports: ["127.0.0.1:${LAWWIZ_FRONTEND_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck: &site-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 32m
    networks: [business-web]

  knowledge-base-frontend:
    build: {context: ../knowledge_base/frontend, dockerfile: Dockerfile, target: production}
    image: lawwiz-knowledge-base-frontend:latest
    restart: unless-stopped
    ports: ["127.0.0.1:${KB_FRONTEND_PORT:-8180}:80"]
    depends_on:
      knowledge-base: {condition: service_healthy}
    healthcheck: *site-healthcheck
    mem_limit: 32m
    networks: [knowledge-web]

volumes:
  lawwiz-mysql:
  lawwiz-redis:
  lawwiz-data:
  lawwiz-kb-data:

networks:
  inference:
  data:
  knowledge:
  business-web:
  knowledge-web:
