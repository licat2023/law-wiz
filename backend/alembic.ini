[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames carry a timestamp so they read in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The database URL is injected by env.py from the application config,
# so no credentials live in this file.
#
# !! THIS FILE MUST STAY ASCII-ONLY. !!
# Alembic reads it via configparser with the OS locale encoding, which is GBK on
# a Chinese Windows install. Non-ASCII comments make alembic die at startup with
# UnicodeDecodeError before it can even print its help. Migration scripts and
# env.py are unaffected (Python source is decoded as UTF-8).
sqlalchemy.url =

[post_write_hooks]
# Format generated migrations with ruff, so they are not the only unformatted code.
# NOTE: type must be `exec`, not `console_scripts`. The ruff wheel ships a Rust
# binary into Scripts/ and registers NO Python console_scripts entry point, so
# alembic's `console_scripts` lookup fails with "Could not find entrypoint".
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
