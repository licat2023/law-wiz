[project]
name = "law-wiz-backend"
version = "0.1.0"
description = "智法宝（law-wiz）—— AI 法律助手平台后端"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # --- Web 框架与数据模型（Pydantic 同时是接口契约的唯一真源）---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # --- 数据库 ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1.1",
    # --- 缓存与令牌（刷新令牌、限流计数）---
    "redis>=5.2",
    # --- 认证与密码学 ---
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "cryptography>=44.0",
    # --- 文件处理（一期仅文本型文件解析，不做本地 OCR）---
    "pypdf>=5.1",
    "python-docx>=1.1",
    # --- 外部能力调用 ---
    "httpx>=0.28",
    # --- 图像处理（P3 印章合成需要；一期仅作依赖占位）---
    "pillow>=11.0",
    "reportlab>=5.0.1",
]

[project.optional-dependencies]
# 向量检索。单独成组的原因见仓库根 README「依赖分组」：
# 它是唯一体积较大且带原生扩展的依赖，且属于 M2/M3 的 AI 底座。
vector = [
    "chromadb>=0.5",
]
# 开发与测试
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# 工具配置
# ============================================================

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["app", "tests", "tools"]
# 迁移脚本由工具生成，DDL 以字符串形式内嵌（长行、`noqa` 不适用），
# 对它套用人工编码规范没有意义 —— 排除而非逐条压制。
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # 行长度由 formatter 处理
    "B008",   # FastAPI 的 Depends() 默认值写法会触发
    "RUF001", # 中文全角标点在注释与文案中是预期用法
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
