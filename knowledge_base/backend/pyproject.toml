# 独立知识库的运行依赖、包构建与 Ruff 检查配置。
[project]
name = "law-wiz-knowledge-base"
version = "0.1.0"
description = "独立知识库、文档处理与检索服务"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.9",
  "pydantic-settings>=2.6", "python-multipart>=0.0.12", "httpx>=0.28",
  "sqlalchemy[asyncio]>=2.0.36", "aiomysql>=0.2", "cryptography>=44",
  "pyjwt>=2.10", "bcrypt>=4.2", "python-docx>=1.1", "pypdf>=5.1",
  "chromadb==1.5.8",
]

[project.optional-dependencies]
# SQLite 异步驱动用于本地验证，生产使用 MySQL 异步驱动。
dev = ["aiosqlite>=0.20", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]
