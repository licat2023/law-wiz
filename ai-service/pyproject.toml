[project]
name = "law-wiz-ai-service"
version = "0.1.0"
description = "智法宝独立 Agent 能力服务"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
