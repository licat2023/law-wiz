# 提供业务站点并代理同源 API，OpenResty 负责公网 HTTPS 和转发头。
user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;

    upstream business_api {
        zone business_api 64k;
        # 重新解析服务名，使后端重建后无需重启站点。
        resolver 127.0.0.11 valid=5s ipv6=off;
        server backend:8000 resolve;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        location ~ ^/api(?:/|$) {
            # 为 20 MiB 合同的 multipart 封装保留空间。
            client_max_body_size 21m;
            proxy_read_timeout 310s;
            # 把业务端点的停用缓冲指令传到上游反向代理。
            proxy_pass_header X-Accel-Buffering;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://business_api;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
