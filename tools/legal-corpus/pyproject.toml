[project]
name = "law-wiz-legal-corpus"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "docling==2.150.1",
  "httpx==0.28.1",
  "playwright==1.65.2",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
